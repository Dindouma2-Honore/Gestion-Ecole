# deptrac.yaml
#
# Règle d'or du projet Ambassadors : un module ne peut JAMAIS dépendre des
# classes internes (Models, Services) d'un autre module. Il ne peut dépendre
# que des Contracts (interfaces) exposés par les autres modules.
#
# Toute violation de ce fichier fait échouer la Pull Request (voir
# .github/workflows/ci.yml).
#
# Doc : https://github.com/qossmic/deptrac

parameters:
  paths:
    - ./app

  exclude_files:
    - '#.*test.*#'

  skip_violations:
    App\Modules\Assiduite\Contracts\AttendanceEngineInterface:
      - App\Modules\Assiduite\Models\AssiduiteJournaliere
    App\Modules\Communication\Jobs\SendWhatsAppMessage:
      - App\Modules\Finances\Models\FacturePreinscription
      - App\Modules\RH\Models\BulletinPaie
      - App\Modules\RH\Services\BulletinPaiePdfService
    App\Modules\Communication\Providers\CommunicationServiceProvider:
      - App\Modules\RH\Events\CandidateApplicationAccepted
      - App\Modules\RH\Events\CandidateApplicationRejected
      - App\Modules\RH\Listeners\CandidateApplicationWhatsAppListener
    App\Modules\Communication\Services\StaffAccountWhatsApp:
      - App\Modules\RH\Models\Employe
    App\Modules\Communication\Services\WhatsAppDispatcher:
      - App\Modules\Finances\Models\FacturePreinscription
      - App\Modules\Finances\Models\Paiement
      - App\Modules\RH\Models\BulletinPaie
    App\Modules\Finances\Services\FacturePreinscriptionService:
      - App\Modules\Communication\Services\WhatsAppDispatcher
    App\Modules\Finances\Services\PaiementService:
      - App\Modules\Communication\Services\WhatsAppDispatcher
    App\Modules\RH\Listeners\CandidateApplicationWhatsAppListener:
      - App\Modules\Communication\Services\WhatsAppDispatcher
    App\Modules\RH\Services\PaieService:
      - App\Modules\Communication\Services\WhatsAppDispatcher
    App\Modules\Socle\Filament\Pages\AcademicYearSettings:
      - App\Modules\RH\Filament\Resources\PosteAdministratifResource
    App\Modules\Socle\Filament\Pages\AdministrationSettings:
      - App\Modules\RH\Filament\Resources\PosteAdministratifResource
    App\Modules\Socle\Filament\Pages\CalendarSettings:
      - App\Modules\RH\Filament\Resources\PosteAdministratifResource
    App\Modules\Socle\Filament\Pages\OrganisationSettings:
      - App\Modules\RH\Filament\Resources\PosteAdministratifResource
      - App\Modules\RH\Models\Employe
    App\Modules\Socle\Filament\Pages\ReferenceSettings:
      - App\Modules\RH\Filament\Resources\PosteAdministratifResource
    App\Modules\Socle\Filament\Resources\UserResource:
      - App\Modules\RH\Models\Employe

  layers:
    # --- Contracts : la seule "surface publique" de chaque module ---
    - name: SocleContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Socle\\(Contracts|Data|Enums|Traits|Exceptions)\\.*

    - name: ScolariteContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Scolarite\\(Contracts|Data)\\.*

    - name: PedagogieContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Pedagogie\\Contracts\\.*

    - name: RHContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\RH\\Contracts\\.*

    - name: FinancesContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Finances\\Contracts\\.*

    - name: AssiduiteContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Assiduite\\Contracts\\.*

    - name: LogistiqueContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Logistique\\Contracts\\.*

    - name: CommunicationContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Communication\\Contracts\\.*

    # --- Internals : tout le reste de chaque module (Models, Services, Http...) ---
    - name: SocleInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Socle\\(?!(Contracts|Data|Enums|Traits|Exceptions)\\).*

    - name: ScolariteInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Scolarite\\(?!(Contracts|Data)\\).*

    - name: PedagogieInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Pedagogie\\(?!Contracts\\).*

    - name: RHInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\RH\\(?!Contracts\\).*

    - name: FinancesInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Finances\\(?!Contracts\\).*

    - name: AssiduiteInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Assiduite\\(?!Contracts\\).*

    - name: LogistiqueInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Logistique\\(?!Contracts\\).*

    - name: CommunicationInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Communication\\(?!Contracts\\).*

    - name: TechniqueContracts
      collectors:
        - type: className
          regex: ^App\\Modules\\Technique\\Contracts\\.*

    - name: TechniqueInternal
      collectors:
        - type: className
          regex: ^App\\Modules\\Technique\\(?!Contracts\\).*

  ruleset:
    SocleContracts:
      - ScolariteContracts
    TechniqueInternal:
      - ScolariteContracts
      - TechniqueContracts
      - SocleContracts
    # Chaque module interne peut utiliser ses propres Contracts,
    # et les Contracts (interfaces) des AUTRES modules — jamais leurs Internals.
    SocleInternal:
      - SocleContracts
      - ScolariteContracts
      - CommunicationContracts
      - RHContracts
    ScolariteInternal:
      - ScolariteContracts
      - SocleContracts
      - FinancesContracts
    PedagogieInternal:
      - PedagogieContracts
      - SocleContracts
      - ScolariteContracts
      - RHContracts
      - LogistiqueContracts
    RHInternal:
      - ScolariteContracts
      - RHContracts
      - SocleContracts
      - FinancesContracts
    FinancesInternal:
      - FinancesContracts
      - SocleContracts
      - ScolariteContracts
    AssiduiteInternal:
      - AssiduiteContracts
      - SocleContracts
      - ScolariteContracts
      - RHContracts
    LogistiqueInternal:
      - ScolariteContracts
      - LogistiqueContracts
      - SocleContracts
    CommunicationInternal:
      - PedagogieContracts
      - CommunicationContracts
      - SocleContracts
      - ScolariteContracts
      - FinancesContracts
