<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#06194e">
    <title>Hors ligne — Ambassadors</title>
    <style>
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: #fff; background: radial-gradient(circle at 50% 20%, #123c91, #06194e 55%, #020b2f); font: 16px/1.6 system-ui, sans-serif; text-align: center; }
        main { max-width: 440px; padding: 36px; border: 1px solid #ffffff30; border-radius: 20px; background: #ffffff0c; }
        img { width: 72px; height: 72px; object-fit: contain; }
        h1 { margin: 18px 0 8px; font: 700 32px Georgia, serif; }
        p { color: #c7d3ec; }
        button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 8px; color: #06194e; background: #e8b52f; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/images/logo.png" alt="Ambassadors">
        <h1>Vous êtes hors ligne</h1>
        <p>La connexion au serveur est indisponible. Reconnectez-vous pour accéder aux modules et enregistrer vos opérations.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
